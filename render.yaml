services:
  - type: web
    name: daylight-demo
    runtime: node
    plan: free
    branch: daylight-demo
    autoDeploy: false
    buildCommand: npm ci --include=dev && npx playwright install chromium && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      - key: APPLICATIONS_ENABLED
        value: "false"
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_PASSWORD
        generateValue: true
